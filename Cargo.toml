[package]
name = "hyperpsee"
version = "0.0.0"
edition = "2024"
repository = "https://github.com/al8n/hyperpsee"
documentation = "https://docs.rs/hyperpsee"
description = "A template for creating Rust open-source repo on GitHub"
license = "MIT OR Apache-2.0"
rust-version = "1.85"
keywords = ["template"]
categories = ["no-std", "no-std::no-alloc"]
exclude = ["/.github/", "/ci/", "/.codecov.yml", "/deny.toml"]

[features]
default = ["serde"]
serde = ["dep:serde", "alloy-primitives/serde", "dep:serde_json"]

[dependencies]
alloy-primitives = { version = "1", features = ["serde"] }
derive_more = { version = "2", default-features = false, features = [
  "is_variant",
  "display",
  "into",
  "from",
  "as_ref",
  "deref",
] }
jsonrpsee = { version = "0.26", features = ["http-client"] }
serde = { version = "1", optional = true, features = ["derive"] }
serde_json = { version = "1", optional = true }
thiserror = "2"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
criterion = "0.8"

[lints]
workspace = true

[workspace.lints.rust]
rust_2018_idioms = "warn"
single_use_lifetimes = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(docsrs)'] }

# Without `bench = false`, `cargo bench` also builds the lib under libtest's bench harness, which
# is not what the `[[bench]]` target below, or `-- --test` in `perf.yml`, is for.
[lib]
bench = false

[[bench]]
path = "benches/foo.rs"
name = "foo"
harness = false

[profile.bench]
opt-level = 3
debug = false
codegen-units = 1
lto = 'thin'
incremental = false
debug-assertions = false
overflow-checks = false
rpath = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
